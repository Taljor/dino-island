<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0f2a1a" />
<title>Dino Island</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<style>
  :root{
    --hud:1;
    --ink:#0a1f14; --jungle:#0f2a1a; --panel:rgba(15,42,26,.86);
    --cream:#fff4d6; --sun:#ffb347; --fern:#5ccf6a; --lagoon:#8fe3ff; --berry:#ff5f7a; --bark:#7a4b00;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--jungle); overscroll-behavior:none;
    font-family:"Arial Rounded MT Bold", ui-rounded, "Nunito", "Segoe UI", system-ui, sans-serif; color:var(--cream);
    user-select:none; -webkit-user-select:none; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hidden{ display:none !important; }
  .card{ background:var(--panel); border:3px solid var(--ink); border-radius:18px; box-shadow:0 6px 0 #061510, 0 12px 26px rgba(0,0,0,.35); }

  /* ---------- HUD ---------- */
  #hud{ position:fixed; inset:0; pointer-events:none; }
  #topleft{ position:absolute; left:max(12px, env(safe-area-inset-left)); top:max(10px, env(safe-area-inset-top)); width:270px; transform-origin:top left; transform:scale(var(--hud)); }
  .namecard{ display:flex; align-items:center; gap:8px; padding:7px 12px; font-weight:800; font-size:15px; }
  #stageBadge{ flex:none; background:var(--sun); color:#3a2300; padding:2px 9px; border-radius:999px; font-size:12px; white-space:nowrap; border:2px solid var(--ink); }
  #dinoName{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #dietBadge{ flex:none; }
  .diet{ font-size:11px; padding:2px 7px; border-radius:999px; font-weight:800; white-space:nowrap; border:2px solid var(--ink); }
  .diet.carnivore{ background:var(--berry); color:#3a0010; } .diet.herbivore{ background:var(--fern); color:#06230d; } .diet.omnivore{ background:var(--sun); color:#3a2300; }
  .bars{ padding:8px 10px 10px; display:flex; flex-direction:column; gap:6px; margin-top:6px; }
  .bar{ display:flex; align-items:center; gap:8px; font-size:15px; }
  .track{ flex:1; height:13px; background:rgba(0,0,0,.38); border-radius:999px; overflow:visible; border:2px solid rgba(0,0,0,.45); position:relative; }
  .fill{ height:100%; width:0%; border-radius:999px; transition:width .3s ease; position:relative; }
  .fill.grow{ background:linear-gradient(90deg,#8ef07f,#39b54a); }
  .fill.hunger{ background:linear-gradient(90deg,#ffc36b,#ff8a3d); }
  .fill.thirst{ background:linear-gradient(90deg,#b9efff,#2f9df0); }
  .tipmark{ position:absolute; right:-9px; top:-4px; }
  .bar.low .track{ animation:blink 1s infinite; }
  @keyframes blink{ 50%{ box-shadow:0 0 0 3px var(--berry); } }
  #growLabel{ font-size:11px; opacity:.85; margin-left:4px; white-space:nowrap; }
  #topright{ position:absolute; right:max(12px, env(safe-area-inset-right)); top:max(10px, env(safe-area-inset-top)); display:flex; gap:8px; align-items:center; transform-origin:top right; transform:scale(var(--hud)); }
  #dayCard{ padding:9px 12px; font-weight:800; font-size:14px; white-space:nowrap; } #dayCard .px{ vertical-align:-5px; } #dayCard .sep{ opacity:.5; margin:0 2px; }
  .rbtn{ pointer-events:auto; width:46px; height:46px; border-radius:14px; border:3px solid var(--ink); background:var(--cream); font-size:22px; box-shadow:0 4px 0 #061510; cursor:pointer; font-family:inherit; }
  .rbtn:active{ transform:translateY(2px); box-shadow:0 2px 0 #061510; }
  #joyBase{ position:absolute; width:124px; height:124px; border-radius:50%; background:rgba(255,255,255,.12); border:3px solid rgba(255,255,255,.35); transform:translate(-50%,-50%) scale(var(--hud)); left:calc(86px * var(--hud)); top:calc(100% - 86px * var(--hud)); transition:opacity .2s; }
  #joyBase.live{ background:rgba(255,255,255,.18); }
  #joyKnob{ position:absolute; left:50%; top:50%; width:56px; height:56px; border-radius:50%; background:var(--sun); border:3px solid var(--ink); transform:translate(-50%,-50%); box-shadow:0 3px 0 #061510; }
  #joyHint{ position:absolute; left:calc(86px * var(--hud)); top:calc(100% - 16px * var(--hud)); transform:translateX(-50%); font-size:calc(11px * var(--hud)); opacity:.8; white-space:nowrap; }
  #rjoyBase{ position:absolute; width:124px; height:124px; border-radius:50%; background:rgba(255,255,255,.12); border:3px solid rgba(255,255,255,.35); transform:translate(-50%,-50%) scale(var(--hud)); left:calc(100% - 86px * var(--hud)); top:calc(100% - 86px * var(--hud)); }
  #rjoyBase.live{ background:rgba(255,255,255,.18); }
  #rjoyKnob{ position:absolute; left:50%; top:50%; width:56px; height:56px; border-radius:50%; background:var(--lagoon); border:3px solid var(--ink); transform:translate(-50%,-50%); box-shadow:0 3px 0 #061510; display:flex; align-items:center; justify-content:center; font-size:22px; }
  #rjoyHint{ position:absolute; left:calc(100% - 86px * var(--hud)); top:calc(100% - 16px * var(--hud)); transform:translateX(-50%); font-size:calc(11px * var(--hud)); opacity:.8; white-space:nowrap; }
  #actWrap{ position:absolute; left:50%; bottom:max(26px, env(safe-area-inset-bottom)); transform:translateX(-50%) scale(max(var(--hud), 0.9)); transform-origin:bottom center; display:flex; gap:10px; }
  #btnAct2{ pointer-events:auto; padding:16px 24px; font-size:22px; font-weight:900; border-radius:22px; border:4px solid var(--ink); background:var(--sun); color:#3a2300; box-shadow:0 6px 0 #061510; font-family:inherit; cursor:pointer; white-space:nowrap; }
  #btnAct2:active{ transform:translateY(3px); box-shadow:0 3px 0 #061510; }
  #btnAct{ pointer-events:auto; padding:16px 24px; font-size:22px; font-weight:900; border-radius:22px; border:4px solid var(--ink); background:var(--lagoon); color:#0b2a3a; box-shadow:0 6px 0 #061510; font-family:inherit; cursor:pointer; }
  #btnAct:active{ transform:translateY(3px); box-shadow:0 3px 0 #061510; }
  #btnAct.pulse{ animation:pulse .9s infinite; }
  #hint{ position:absolute; left:50%; bottom:calc(max(26px, env(safe-area-inset-bottom)) + 74px * max(var(--hud), 0.9)); transform:translateX(-50%) scale(var(--hud)); transform-origin:bottom center; display:flex; align-items:center; gap:8px; padding:6px 12px; font-weight:800; font-size:15px; white-space:nowrap; }
  #hintArrow{ display:inline-block; line-height:1; }
  #hintText{ font-size:12px; opacity:.85; }
  @keyframes pulse{ 50%{ transform:scale(1.08); } }

  /* ---------- toasts ---------- */
  #toasts{ position:fixed; left:50%; top:calc(max(10px, env(safe-area-inset-top)) + 4px); transform:translateX(-50%) scale(var(--hud)); transform-origin:top center; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:540px; max-width:calc(92vw / var(--hud)); }
  .toast{ background:var(--panel); border:3px solid var(--ink); border-radius:16px; padding:8px 14px; font-weight:800; font-size:15px; opacity:0; transform:translateY(-10px) scale(.95); transition:all .3s; text-align:center; box-shadow:0 4px 0 #061510; max-width:100%; }
  .toast.show{ opacity:1; transform:none; }
  .toast.gold{ background:var(--sun); color:#3a2300; border-color:var(--bark); box-shadow:0 4px 0 var(--bark); }
  .toast.grow{ background:var(--fern); color:#06230d; }

  /* ---------- start screen ---------- */
  #start{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 15%, rgba(255,214,120,.38), rgba(10,30,20,.78) 70%); }
  #start .card{ width:min(88vw,420px); padding:22px 22px 16px; text-align:center; }
  .egg{ animation:wobble 2.4s ease-in-out infinite; display:inline-block; }
  .px{ image-rendering:pixelated; image-rendering:-webkit-crisp-edges; image-rendering:crisp-edges; display:inline-block; vertical-align:middle; }
  .namecard .px, .diet .px{ vertical-align:-4px; } .bar > .px{ flex:none; } .toast .px{ vertical-align:-5px; margin:0 2px; }
  .bigbtn .px, .tab .px, #btnAct .px, #btnAct2 .px, #closePanel .px{ vertical-align:-5px; margin-right:4px; } .rbtn .px{ margin:0; vertical-align:middle; }
  .sp .em .px{ display:block; margin:0 auto; } #rjoyKnob .px{ display:block; } .trophy .em .px, .skin .px{ vertical-align:middle; } #speciesInfo .px{ vertical-align:-3px; }
  @keyframes wobble{ 0%,100%{ transform:rotate(-8deg);} 50%{ transform:rotate(8deg);} }
  #start h1{ margin:6px 0 0; font-size:44px; letter-spacing:2px; color:var(--sun); text-shadow:0 4px 0 var(--bark), 0 8px 18px rgba(0,0,0,.4); }
  #start p{ margin:8px 0 14px; font-size:15px; opacity:.92; }
  #start p.tip{ font-size:12px; opacity:.75; margin:12px 0 0; }
  #speciesRow{ display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; touch-action:pan-x; -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity; }
  .sp{ flex:0 0 auto; width:84px; padding:8px 4px 7px; border-radius:14px; border:3px solid transparent; background:rgba(0,0,0,.25); text-align:center; cursor:pointer; scroll-snap-align:center; }
  .sp.on{ border-color:var(--sun); background:rgba(255,179,71,.18); }
  .sp .em{ line-height:1; height:50px; } .sp .nm{ font-weight:900; font-size:13px; margin-top:2px; } .sp .diet{ display:inline-block; margin-top:4px; font-size:10px; padding:1px 6px; }
  #speciesInfo{ font-size:13px; font-weight:700; min-height:18px; margin:0 0 10px; opacity:.92; }
  #nameInput{ width:100%; padding:12px 14px; font-size:18px; border-radius:14px; border:3px solid var(--ink); text-align:center; margin-bottom:10px; font-family:inherit; font-weight:800; color:#123320; background:#fff; }
  .bigbtn{ width:100%; padding:16px; font-size:22px; font-weight:900; border-radius:18px; border:4px solid var(--ink); background:var(--fern); color:#06230d; box-shadow:0 6px 0 #061510; margin-top:8px; cursor:pointer; font-family:inherit; }
  .bigbtn.alt{ background:var(--cream); color:#123320; font-size:16px; padding:12px; }
  .bigbtn.warn{ background:var(--berry); color:#3a0010; }
  .bigbtn:active{ transform:translateY(3px); box-shadow:0 3px 0 #061510; }
  .bigbtn:focus-visible,.rbtn:focus-visible,.tab:focus-visible{ outline:3px solid var(--lagoon); outline-offset:2px; }

  /* ---------- panel (skins / trophies / menu) ---------- */
  #panel{ position:fixed; inset:0; background:rgba(5,18,11,.72); display:flex; align-items:center; justify-content:center; }
  #panel .card{ width:min(92vw,560px); max-height:88vh; display:flex; flex-direction:column; overflow:hidden; }
  .tabs{ display:flex; gap:6px; padding:10px 10px 0; }
  .tab{ flex:1; padding:10px 4px; border-radius:12px; border:3px solid var(--ink); background:#1d4a2f; color:var(--cream); font-weight:900; font-family:inherit; font-size:15px; cursor:pointer; }
  .tab.on{ background:var(--sun); color:#3a2300; }
  #panelBody{ overflow:auto; padding:12px; -webkit-overflow-scrolling:touch; touch-action:pan-y; min-height:120px; }
  .skin{ display:flex; align-items:center; gap:10px; padding:10px; border-radius:14px; border:3px solid transparent; margin-bottom:8px; background:rgba(0,0,0,.25); cursor:pointer; }
  .skin.on{ border-color:var(--sun); } .skin.locked{ opacity:.6; cursor:default; }
  .sw{ display:flex; gap:4px; } .sw i{ width:18px; height:18px; border-radius:50%; border:2px solid var(--ink); display:block; }
  .skin .nm{ font-weight:900; flex:1; } .skin small{ font-size:12px; opacity:.85; display:block; font-weight:600; }
  .trophy{ display:flex; gap:10px; align-items:center; padding:8px 10px; border-radius:12px; background:rgba(0,0,0,.25); margin-bottom:8px; }
  .trophy .em{ font-size:24px; } .trophy .nm{ font-weight:900; } .trophy .pr{ font-size:12px; opacity:.85; }
  .trophy .bar2{ height:8px; border-radius:999px; background:rgba(0,0,0,.4); margin-top:5px; overflow:hidden; } .trophy .bar2 i{ display:block; height:100%; background:var(--sun); }
  .trophy.done{ background:rgba(255,213,74,.22); }
  .menuitem{ margin:0 0 8px; }
  .zone{ font-size:12px; letter-spacing:1px; text-transform:uppercase; opacity:.7; margin:14px 0 6px; }
  .panelfoot{ padding:0 12px 12px; }
  .slider{ padding:8px 4px 4px; margin-bottom:8px; } .slider .lbl{ display:flex; justify-content:space-between; font-weight:900; font-size:15px; margin-bottom:6px; } .slider .sub{ font-size:11px; opacity:.7; margin-top:4px; }
  .slider input[type=range]{ width:100%; accent-color:var(--sun); touch-action:none; height:32px; }
  .mini{ font-family:inherit; font-weight:800; font-size:11px; padding:3px 8px; border-radius:8px; border:2px solid var(--ink); background:var(--cream); color:#123320; cursor:pointer; margin-left:4px; }
  #dbg{ position:fixed; left:0; right:0; bottom:0; background:#b3261e; color:#fff; font:12px/1.3 ui-monospace, Menlo, monospace; padding:6px 10px; z-index:99; white-space:pre-wrap; }
  @media (max-width: 520px){ #growLabel{ display:none; } .dayLabel{ display:none; } #hintText{ display:none; } #stageBadge .w{ display:none; } #stageBadge{ padding:2px 6px; } }
  @media (prefers-reduced-motion: reduce){ .egg, #btnAct.pulse, .bar.low .track{ animation:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="topleft">
    <div class="card namecard"><span id="stageBadge">Hatchling</span><span id="dinoName">Rexy</span><span id="dietBadge" class="diet carnivore"></span></div>
    <div class="card bars">
      <div class="bar"><i class="ico" data-ico="sprout" data-size="24"></i><div class="track"><div id="bGrow" class="fill grow"></div></div><span id="growLabel">→ Juvenile</span></div>
      <div class="bar" id="hungerRow"><i class="ico" data-ico="meat" data-size="24"></i><div class="track"><div id="bHunger" class="fill hunger"></div></div></div>
      <div class="bar" id="thirstRow"><i class="ico" data-ico="drop" data-size="24"></i><div class="track"><div id="bThirst" class="fill thirst"></div></div></div>
    </div>
  </div>
  <div id="topright">
    <div id="dayCard" class="card"><i class="ico" data-ico="egg" data-size="22"></i><span id="eggNum">0</span> <span class="sep">·</span> <span id="biomeIcon"></span> <span id="dayIcon"></span> <span class="dayLabel">Day </span><span id="dayNum">1</span></div>
    <button class="rbtn" id="btnSkins" aria-label="Skins and trophies"><i class="ico" data-ico="palette" data-size="28"></i></button>
    <button class="rbtn" id="btnMenu" aria-label="Menu"><i class="ico" data-ico="gear" data-size="28"></i></button>
  </div>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="joyHint">walk</div>
  <div id="rjoyBase"><div id="rjoyKnob"><i class="ico" data-ico="arrows" data-size="30"></i></div></div>
  <div id="rjoyHint">turn</div>
  <div id="actWrap"><button id="btnAct2" class="hidden">Defend</button><button id="btnAct" class="hidden"><i class="ico" data-ico="drop" data-size="22"></i>Drink</button></div>
  <div id="hint" class="card hidden"><span id="hintIcon"></span><span id="hintArrow"></span><span id="hintText">this way</span></div>
</div>

<div id="toasts"></div>
<div id="dbg" class="hidden"></div>

<div id="start">
  <div class="card">
    <i class="ico egg" data-ico="egg" data-size="80"></i>
    <h1>DINO ISLAND</h1>
    <p>Hatch. Eat. Grow up. Unlock skins!</p>
    <div id="speciesRow"></div>
    <div id="speciesInfo"></div>
    <input id="nameInput" maxlength="12" placeholder="Name your dino" autocomplete="off" />
    <button id="btnContinue" class="bigbtn hidden">Continue</button>
    <button id="btnNew" class="bigbtn">Tap to hatch!</button>
    <p class="tip">Left stick: forward / back · Right stick: turn · Quick tap anywhere = bite / defend (drink at the shore) · Press and hold = sticks · v2.0</p>
    <a id="homeLink" class="bigbtn alt" href="../" style="display:none;text-decoration:none;margin-top:6px;font-size:14px;padding:10px">🕹️ Back to the arcade</a>
  </div>
</div>

<div id="panel" class="hidden">
  <div class="card">
    <div class="tabs">
      <button class="tab on" id="tabSkins" data-tab="skins"><i class="ico" data-ico="palette" data-size="20"></i>Skins</button>
      <button class="tab" id="tabTrophies" data-tab="trophies"><i class="ico" data-ico="trophy" data-size="20"></i>Trophies</button>
      <button class="tab" id="tabMenu" data-tab="menu"><i class="ico" data-ico="gear" data-size="20"></i>Menu</button>
    </div>
    <div id="panelBody"></div>
    <div class="panelfoot"><button class="bigbtn alt" id="closePanel"><i class="ico" data-ico="palm" data-size="24"></i>Back to the island</button></div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================================================================
   CONFIG — parents: tune the game here
   ================================================================ */
const CONFIG = {
  dayLengthSec: 240,             // real seconds per in-game day
  hungerDrainPerSec: 0.40,       // ~4 minutes from full to empty
  thirstDrainPerSec: 0.55,       // ~3 minutes from full to empty
  stageThresholds: [12, 30, 55], // growth points to become Juvenile, Sub-Adult, Adult
  lowNeedPenalty: 0.5,           // growth multiplier while thirsty (<25)
  drinkAmount: 45,
  food: {
    berry: { name:'Berries',     icon:'berry', hunger:18, growth:1, respawn:25, count:18, diet:'plant' },
    leaf:  { name:'Leaves',      icon:'leaf', hunger:20, growth:1, respawn:25, count:18, diet:'plant' },
    fish:  { name:'Fish',        icon:'fish', hunger:26, growth:2, respawn:35, count:12, diet:'meat' },
    snack: { name:'Meaty snack', icon:'meat', hunger:38, growth:3, respawn:45, count:10, diet:'meat' },
  },
  favoriteBonus: 1,              // extra growth points for eating your species' favorite food
  eggs: { count:6, minDist:28, incubateSec:20, maxFollowers:6, respawnSec:60 },   // egg hunt
  babyScale: 0.45, adultScale: 1.0,
  autosaveSec: 8,
};
const KEY = 'dino-island-save-v1', KEY_PREFS = 'dino-island-prefs-v1';
const STAGES = ['Hatchling','Juvenile','Sub-Adult','Adult'];
// Species: body = biped (two legs, arms) or quad (four legs). size = adult scale, speed = multiplier, favorite = food id (+bonus growth).
const SPECIES = {
  rex:      { name:'Rex',      label:'T. rex',        icon:'rex', diet:'carnivore', body:'biped', size:1.1,  speed:1.0,  favorite:'snack', headScale:1.15, armScale:0.7, tailLen:5, features:['teeth'],           blurb:'the king · big bite' },
  raptor:   { name:'Raptor',   label:'Velociraptor',  icon:'raptor', diet:'carnivore', body:'biped', size:0.75, speed:1.3,  favorite:'snack', headScale:0.9,  armScale:1.4, tailLen:5, features:['sickle','feathers'], blurb:'fast & feathery' },
  spino:    { name:'Spino',    label:'Spinosaurus',   icon:'spino', diet:'carnivore', body:'biped', size:1.15, speed:0.95, favorite:'fish',  headScale:1.0,  armScale:1.2, tailLen:6, features:['sail','longsnout'],  blurb:'loves fish · big sail', wade:0.5 },
  trike:    { name:'Trike',    label:'Triceratops',   icon:'trike', diet:'herbivore', body:'quad',  size:1.0,  speed:0.9,  favorite:'leaf',  headScale:1.15, tailLen:3, features:['frill','horns'],     blurb:'three horns · sturdy' },
  stego:    { name:'Stego',    label:'Stegosaurus',   icon:'stego', diet:'herbivore', body:'quad',  size:1.0,  speed:0.8,  favorite:'berry', headScale:0.7,  tailLen:4, features:['plates','tailspikes'], blurb:'back plates · spiky tail' },
  longneck: { name:'Longneck', label:'Brachiosaurus', icon:'longneck', diet:'herbivore', body:'quad',  size:1.35, speed:0.85, favorite:'leaf',  headScale:0.7,  tailLen:5, features:['longneck'],          blurb:'grows HUGE', camLift:1.4 },
  anky:     { name:'Anky',     label:'Ankylosaurus',  icon:'anky', diet:'herbivore', body:'quad',  size:0.9,  speed:0.75, favorite:'berry', headScale:0.8,  tailLen:4, features:['armor','club'],      blurb:'armored · club tail' },
  galli:    { name:'Galli',    label:'Gallimimus',    icon:'galli', diet:'omnivore',  body:'biped', size:0.85, speed:1.35, favorite:'berry', headScale:0.75, armScale:1.2, tailLen:4, features:['longneck'],        blurb:'fastest runner' },
  ovi:      { name:'Ovi',      label:'Oviraptor',     icon:'ovi', diet:'omnivore',  body:'biped', size:0.7,  speed:1.15, favorite:'fish',  headScale:0.85, armScale:1.3, tailLen:3, features:['crest','feathers'], blurb:'crested · eats anything' },
};
const DIET = { carnivore:{ word:'carnivore', icon:'meat', eats:['fish','meat'] }, herbivore:{ word:'herbivore', icon:'leaf', eats:['berry','leaf'] }, omnivore:{ word:'omnivore', icon:'omni', eats:['berry','leaf','fish','meat'] } };
function speciesCanEat(sp, foodType){ const fd=CONFIG.food[foodType].diet; return sp.diet==='omnivore' || (sp.diet==='herbivore' && fd==='plant') || (sp.diet==='carnivore' && fd==='meat'); }

const TAU = Math.PI*2;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const rand = (a,b)=>a+Math.random()*(b-a);
const hex = n=>'#'+n.toString(16).padStart(6,'0');
function smoothstep(e0,e1,x){ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }
function angleDiff(a,b){ return ((a-b+Math.PI)%TAU+TAU)%TAU-Math.PI; }
function turnToward(cur,target,maxStep){ const d=angleDiff(target,cur); if(Math.abs(d)<=maxStep) return target; return cur+Math.sign(d)*maxStep; }
function hash2(x,y){ const n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function vnoise(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi; const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1); return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v; }
function fbm(x,y){ return vnoise(x,y)*0.55 + vnoise(x*2.1+7.3,y*2.1+3.1)*0.28 + vnoise(x*4.3+1.7,y*4.3+9.2)*0.17; }

const mem = {};
const Store = {
  async get(k){
    try{ if(window.storage && window.storage.get){ const r=await window.storage.get(k,false); if(r && r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const v=localStorage.getItem(k); if(v) return JSON.parse(v); }catch(e){}
    return mem[k]||null;
  },
  async set(k,v){
    const s=JSON.stringify(v);
    try{ if(window.storage && window.storage.set){ const r=await window.storage.set(k,s,false); if(r) return true; } }catch(e){}
    try{ localStorage.setItem(k,s); return true; }catch(e){}
    mem[k]=v; return true;
  },
  async del(k){
    try{ if(window.storage && window.storage.delete){ await window.storage.delete(k,false); } }catch(e){}
    try{ localStorage.removeItem(k); }catch(e){}
    delete mem[k];
  }
};

function pxDataURL(grid,scale){ try{ const c=document.createElement('canvas'); c.width=c.height=16*scale; const x=c.getContext('2d'); if(!x) return ''; for(let y=0;y<16;y++){ const row=grid[y]; for(let i=0;i<16;i++){ const ch=row[i]; if(ch==='.') continue; x.fillStyle=PX_PAL[ch]||'#f0f'; x.fillRect(i*scale,y*scale,scale,scale); } } return c.toDataURL('image/png'); }catch(e){ return ''; } }
function iconURL(name){ if(PX_URL[name]===undefined){ const g=PX[name]; PX_URL[name]=g?pxDataURL(g,6):''; } return PX_URL[name]; }
function ico(name,size,cls){ size=size||24; return `<img class="px${cls?' '+cls:''}" src="${iconURL(name)}" width="${size}" height="${size}" alt="" draggable="false">`; }
function icoEl(name,size,cls){ const img=document.createElement('img'); img.className='px'+(cls?' '+cls:''); img.src=iconURL(name); img.width=size||24; img.height=size||24; img.alt=''; img.draggable=false; return img; }

const BIOME_IDS = ['meadow','jungle','swamp','desert','snow','volcanic'];
const RIVER_PTS=[[-40,-44],[-33,-33],[-27,-22],[-23,-12],[-21,-3],[-19,5],[-17,11]];   // snowy peaks → meadow lake
function riverDist(x,z){ let best=1e9; for(let i=0;i<RIVER_PTS.length-1;i++){ const ax=RIVER_PTS[i][0], az=RIVER_PTS[i][1], bx=RIVER_PTS[i+1][0], bz=RIVER_PTS[i+1][1]; const dx=bx-ax, dz=bz-az; const t=clamp(((x-ax)*dx+(z-az)*dz)/(dx*dx+dz*dz),0,1); const d=Math.hypot(x-(ax+dx*t), z-(az+dz*t)); if(d<best) best=d; } return best; }
function riverAt(x,z){ return riverDist(x,z)<1.8; }
const _bw=[0,0,0,0,0,0], _bh=[0,0,0,0,0,0];
function biomeWeights(x,z,out){
  const d=Math.hypot(x,z); const a=Math.atan2(z,x)+(fbm(x*0.022+11.3, z*0.022+5.9)-0.5)*0.8;
  const ring=smoothstep(16,34,d); let sum=0;
  out[0]=1-ring; sum+=out[0];
  for(let i=1;i<6;i++){ const da=angleDiff(a, BIOMES[BIOME_IDS[i]].ang); const w=Math.exp(-(da/0.62)*(da/0.62))*ring; out[i]=w; sum+=w; }
  for(let i=0;i<6;i++) out[i]/=sum; return out;
}
function dominantBiome(x,z){ const w=biomeWeights(x,z,_bw); let bi=0; for(let i=1;i<6;i++) if(w[i]>w[bi]) bi=i; return BIOME_IDS[bi]; }
function terrainHeight(x,z){
  const d=Math.hypot(x,z);
  const island=1-smoothstep(ISLAND_R*0.66, ISLAND_R, d);
  const w=biomeWeights(x,z,_bh);
  let h=(fbm(x*0.035+3.1, z*0.035+7.7)-0.25)*9*island + island*2.4 - 1.4;
  let shape=0;
  shape += w[1]*((fbm(x*0.08+2, z*0.08+9)-0.5)*4.5 + 0.6);                                   // jungle: rolling hills
  shape += w[2]*(-1.7 - 2.4*smoothstep(0.55,0.68, fbm(x*0.07+5, z*0.07+1)));                   // swamp: low, with pools
  shape += w[3]*(-0.7 + Math.sin(x*0.25+z*0.12)*0.5 + Math.sin(z*0.3+x*0.05)*0.3);             // desert: dunes
  shape += w[4]*(5.2 + (fbm(x*0.06+8, z*0.06+3)-0.5)*3.2);                                     // snow: high plateau
  shape += w[5]*(1.3 + (fbm(x*0.12+1, z*0.12+4)-0.5)*3.2);                                     // badlands: rough
  h += shape*island;
  h -= 1.1*(1-smoothstep(0.7, 3.0, riverDist(x,z)))*island;   // river groove
  h -= 5.5*(1-smoothstep(0, LAKE.r, Math.hypot(x-LAKE.x, z-LAKE.z)));
  h -= 4.8*(1-smoothstep(0, OASIS.r, Math.hypot(x-OASIS.x, z-OASIS.z)));
  h -= 5.5*(1-smoothstep(0, LAGOON.r, Math.hypot(x-LAGOON.x, z-LAGOON.z)));
  const dv=Math.hypot(x-VOLCANO.x, z-VOLCANO.z);
  h += 14*(1-smoothstep(0, VOLCANO.r, dv)) - 5*(1-smoothstep(0, 3.2, dv));
  return h;
}

}

  for(const c of critters) c.update(dt,t,pp,ps);
  for(const b of bursts) b.update(dt);
  for(const p of anim.puffs){ p.t+=dt; if(p.t>4) p.t-=4; const u=p.t/4; p.m.position.set(LM_POS.volcano.x+Math.sin(u*5+p.seed)*0.5, LM_POS.volcano.h+0.6+u*7, LM_POS.volcano.z+Math.cos(u*4+p.seed)*0.5); p.m.scale.setScalar(0.6+u*2.2); p.m.material.opacity=0.45*(1-u); }
  anim.lava.scale.setScalar(1+Math.sin(t*2)*0.04);
  for(let i=0;i<anim.palms.length;i++) anim.palms[i].rotation.z=Math.sin(t*1.2+i)*0.06;
  if(anim.fireflies.visible){ const a=anim.fireflies.geometry.attributes.position; for(let i=0;i<a.count;i++){ a.setY(i, anim.fireBase[i*3+1]+Math.sin(t*1.5+i)*0.45); a.setX(i, anim.fireBase[i*3]+Math.sin(t*0.7+i*1.3)*0.4); } a.needsUpdate=true; }
  for(const f of anim.frogs){ f.ph+=dt*2.2; const hop=Math.max(0,Math.sin(f.ph)); if(hop>0.05){ f.g.position.x+=Math.sin(f.yaw)*dt*0.7; f.g.position.z+=Math.cos(f.yaw)*dt*0.7; } else if(Math.random()<0.02){ f.yaw=rand(0,TAU); f.g.rotation.y=f.yaw; } if(Math.hypot(f.g.position.x-LAGOON.x,f.g.position.z-LAGOON.z)>LAGOON.r+5){ f.yaw+=Math.PI; f.g.rotation.y=f.yaw; } f.g.position.y=Math.max(terrainHeight(f.g.position.x,f.g.position.z),WATER_Y)+0.05+hop*0.35; }
  updateEggs(dt,t);
  biomeCheckT-=dt; if(biomeCheckT<=0){ biomeCheckT=0.5; const bm=dominantBiome(pp.x,pp.z); if(bm!==curBiome){ biomeT+=0.5; if(biomeT>=1.0){ curBiome=bm; biomeT=0; toast(`{ico:${BIOMES[bm].icon}} ${BIOMES[bm].name}`); renderTokens(el.biomeIcon, `{ico:${BIOMES[bm].icon}:24}`); } } else biomeT=0; }
  lmTimer-=dt; if(lmTimer<=0){ lmTimer=0.5; for(const lm of LANDMARKS){ if(state.landmarks.includes(lm.id)) continue; const p=LM_POS[lm.id]; if(Math.hypot(pp.x-p.x,pp.z-p.z)<lm.r) discover(lm); } if(state.stats.distance>=1000 && !state.achievements.includes('marathon')) checkAchievements(); }
  updateCamera(dt,moving);
  hudTimer-=dt; if(hudTimer<=0){ hudTimer=0.1; updateHud(); }
  saveTimer+=dt; if(saveTimer>=CONFIG.autosaveSec){ saveTimer=0; save(); }
}

/* ================================================================
   loop / boot
   ================================================================ */
let last=performance.now(), frameNo=0;
function loop(){
  requestAnimationFrame(loop);
  const nowMs=performance.now(); let dt=(nowMs-last)/1000; last=nowMs; if(!isFinite(dt)) dt=1/60; dt=clamp(dt,0,0.05);
  if((frameNo++&15)===0) fitRenderer(false);
  try{
    if(!started){ const t=nowMs/1000; camera.position.set(spawn.x+Math.sin(t*0.15)*13, spawn.h+6.5, spawn.z+Math.cos(t*0.15)*13); camera.lookAt(spawn.x, spawn.h+0.8, spawn.z); state.time=(state.time+dt*0.25)%CONFIG.dayLengthSec; dino.root.position.set(spawn.x,spawn.h,spawn.z); dino.root.rotation.y=Math.PI*0.9+Math.sin(t*0.3)*0.4; dino.root.scale.setScalar(0.8); dino.root.visible=!hatching; animateRig(dino, dt, t, 0, 1); updateSky(); updateLiving(dt,t); for(const c of critters) c.update(dt,t,dino.root.position,0); updateFoods(dt,t); for(const p of anim.puffs){ p.t+=dt; if(p.t>4) p.t-=4; const u=p.t/4; p.m.position.set(LM_POS.volcano.x, LM_POS.volcano.h+0.6+u*7, LM_POS.volcano.z); p.m.scale.setScalar(0.6+u*2.2); p.m.material.opacity=0.45*(1-u); } }
    else if(!paused) update(dt);
  }catch(err){ showDbg('update: '+(err && err.message || err)); }
  try{ Music.update(); }catch(err){ showDbg('music: '+(err && err.message || err)); }
  try{ renderer.render(scene,camera); }catch(err){ showDbg('render: '+(err && err.message || err)); }
}
window.addEventListener('resize', ()=>fitRenderer(false));
window.addEventListener('orientationchange', ()=>setTimeout(()=>fitRenderer(true),300));
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ save(); joyReset(); } else last=performance.now(); });
window.addEventListener('pagehide', ()=>{ save(); });
window.addEventListener('contextmenu', e=>e.preventDefault());

window.DinoIsland = { state, CONFIG, SPECIES, foods, critters, doAction, playerHit, sun, eggs, followers, hatchNestEgg, LIVE, riverAt, RIVER_PTS, joyState:()=>({ hud:HUD, mag:joy.mag, y:joy.y, knob:el.joyKnob.style.transform }), get baseFov(){ return baseFov; }, set yaw(v){ playerYaw=v; dino.root.rotation.y=v; }, get dino(){ return dino; }, setSpecies, music:Music, get audioCtx(){ return AudioSys.ctx; }, world:{ ISLAND_R, terrainHeight, dominantBiome, LM_POS, LAVA, inLava, get frogs(){ return anim.frogs.length; } }, camera, renderer, scene, spawn, teleport:(x,z)=>{ dino.root.position.set(x,terrainHeight(x,z),z); cancelWalkTarget(); }, get walkTarget(){ return walkTarget; }, get camYaw(){ return camYaw; } };

(async function boot(){
  try{ const p=await Store.get(KEY_PREFS); if(p){ Object.assign(prefs,p); applyQuality(); } }catch(e){}
  try{ const d=await Store.get(KEY); if(d && d.v===1){ applySave(d); hasSave=true; selectedSpecies=state.species; setSpecies(state.species); applySkin(state.skin); } }catch(e){}
  initIcons();
  showStart();
  requestAnimationFrame(loop);
})();
})();
</script>
<script>
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    let hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(hadController){ hadController=false; location.reload(); } else hadController=true; });
    navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(reg=>{ try{ reg.update(); }catch(e){} }).catch(()=>{});
  });
}
</script>
